<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap-5.2.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style=" background: #f1f5f9 !important;
  min-height: 100vh !important;">
    <div class="container mt-5">
        <div class="mt-3">
            <h1 class="text-center">Place Your Order</h1>
            <form action="" id="orderForm">
                <div class="mt-3">
                    
                    <label class="form-label" for="">Name</label>
                    <input class="form-control" type="text" name="" id="name">
                
                </div>
                <div class="mt-3">
                    <label class="form-label" for="">Contact</label>
                    <input class="form-control" type="number" name="" id="contact">
                
                </div>
                <div class="mt-3">
                    <label class="form-label" for="">Address</label>
                    <textarea class="form-control" name="" id="address" rows="3"></textarea>
                
                </div>
                <div class="mt-3">
                    <label class="form-label" for="">No Of Guests</label>
                    <input class="form-control" type="number" name="" id="TotalGuests">
                
                </div>
                <button class="btn btn-success  mt-3">Book Your Room</button>
            </form>
        </div>
    </div>
    <script src="booking.js"></script>
</body>
</html>
